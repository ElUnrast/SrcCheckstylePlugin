plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '1.3.1'
}

group = 'de.src-gmbh'
version = '0.1.0'

java {
    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of( 25 )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly gradleApi()
    compileOnly 'com.puppycrawl.tools:checkstyle:14.1.0'

    testImplementation gradleTestKit()
    testImplementation 'com.puppycrawl.tools:checkstyle:14.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testRuntimeOnly 'com.puppycrawl.tools:checkstyle:14.1.0'
}

gradlePlugin {
    website = 'https://github.com/ElUnrast/SrcCheckstylePlugin'
    vcsUrl = 'https://github.com/ElUnrast/SrcCheckstylePlugin.git'

    plugins {
        srcCheckstyle {
            id = 'de.src-gmbh.checkstyle'
            displayName = 'SRC Checkstyle Plugin'
            description = 'Checks Java code against a bundled Checkstyle rule set and automatically fixes safe style and formatting violations.'
            tags.set( ['checkstyle', 'java', 'code-style', 'formatting'] )
            implementationClass = 'com.src.gradle.plugins.checkstyle.C_SrcCheckstylePlugin'
        }
    }
}

tasks.named( 'test' ) {
    useJUnitPlatform()
}
